[project]
name = "pairwise-memory"
version = "0.1.0"
description = "Temporal-governance engine with prime-indexed memory and enriched risk semantics."
authors = [{ name = "Jamie Kinney" }]
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "flake8>=7.0.0",
    "coverage>=7.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
